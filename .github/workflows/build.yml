name: 生成信息屏

# 这台电脑不是服务器 —— 出图这件事整个交给 GitHub。
# 本地只负责改代码和自检，push 上去之后 Actions 按点出图，
# 图**覆盖**到一个专用分支 `screen`（主分支历史不涨），Kindle 从
# Pages / jsDelivr / raw 三个出口里挑能通的拉，三个都指向 screen 分支那张。
#
# 为什么是每小时，不是"一天四次"（以前那版）：
# 屏幕上那个大号气温、湿度、风力都是**画死在图里的像素**，不是设备自己算的 ——
# 图多久重算一次，数据就有多新。一天四次的话，下午看到的可能是早上 05:10 的气温。
# 每小时 = 屏上任何数字最多旧 1 小时。公开仓库的 Actions 额度不限量，
# 24 次/天 × 约 35 秒，成本仍然是 ¥0。
#
# 配套的另一半在设备上：kindle/extensions/aistatus/config.sh 的 UPDATE_INTERVAL=3600。
# 这边每小时出一张、那边每小时来取，节奏要对得上。

on:
  schedule:
    # 每小时一次。GitHub 的 cron 是 UTC，但"每小时"不需要换算。
    # ⚠️ 整点任务排队会晚几分钟到几十分钟，设备那边的间隔是从"上次成功"往后推的，
    #    天然错开，不会卡在整点上取到旧图。
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:          # 网页上可以手动点一次，改完版式立刻看效果

# 同一时间只跑一个：上一轮还没提交完，下一轮不要插进来
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write             # 要把生成的图提交回来

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      # 字体必须在装，否则中文全是方框。思源黑体来自 fonts-noto-cjk，
      # 同一个包里还带 NotoSerifCJK —— 版式里那个宋体大数字靠的就是它。
      # 万一 runner 上没装到宋体，fonts.py 会自动退回粗体黑，
      # 版面几何不变（数字宽度差 <3%），只是书卷气差一点，不会出坏图。
      - name: 装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f > /dev/null 2>&1
          echo "--- 实际可用的中文字体 ---"
          fc-list :lang=zh family | sort -u | head -n 12

      - name: 装依赖（只有 Pillow / PyYAML / requests）
        run: pip install -r dashboard/requirements.txt

      - name: 生成信息屏图片
        env:
          TZ: Asia/Shanghai
        run: python dashboard/generate.py --config dashboard/config.yaml

      # 生成物放一个**专用分支 screen**，每次覆盖 —— 主分支的历史不会因为出图而变长。
      # 另一条路是"每月删一次历史"，但删完 GitHub 不一定立刻回收那些对象，
      # 而且定期 force-push 重写历史本身也有踩空的风险；一个只装一张图的分支
      # 没这两个问题，历史永远就一个提交。
      #
      # 生成失败就不会走到这一步 —— screen 上留着上一张正常图。
      # 屏幕上显示"一小时前的图"远好过显示半成品或者 404。
      - name: 发布到 screen 分支（Pages 从这里取）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$(mktemp -d)"
          git init -q -b screen
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/docs/dashboard.png" dashboard.png
          git add dashboard.png
          git commit -q -m "信息屏 $(TZ=Asia/Shanghai date '+%m-%d %H:%M')"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screen
          echo "已覆盖 screen 分支上的 dashboard.png"

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "## 信息屏生成结果"
            echo ""
            if [ -f docs/dashboard.png ]; then
              echo "- 图片：$(stat -c%s docs/dashboard.png) 字节"
            else
              echo "- ★ 没有生成出图片"
            fi
            if [ -f docs/debug.json ]; then
              echo ""
              echo '```json'
              python -c "import json;d=json.load(open('docs/debug.json',encoding='utf-8'));print(json.dumps(d.get('counts',{}),ensure_ascii=False,indent=2))" || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
